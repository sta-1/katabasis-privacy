<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verification — Katabasis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0a0812;
      --iron: #1a1620;
      --amber-hi: #e8952a;
      --amber-dim: #8a5210;
      --amber: #c87a1a;
      --text: #d4ccd8;
      --text-dim: #8a7e90;
      --border: #2e2838;
      --danger: #c97070;
    }
    body { background: var(--black); color: var(--text); font-family: 'Courier New', Courier, monospace; line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--amber-hi); text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 40px; border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-size: 16px; font-weight: bold; letter-spacing: 4px; color: var(--amber-hi); }
    .nav-links { display: flex; gap: 24px; font-size: 11px; letter-spacing: 2px; }
    .nav-links a { color: var(--text-dim); }
    .nav-links a:hover { color: var(--amber-hi); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .card {
      max-width: 480px; width: 100%;
      background: var(--iron); border: 1px solid var(--border); border-radius: 6px;
      padding: 48px 32px; text-align: center; position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--amber-dim), transparent);
    }
    .icon { font-size: 48px; margin-bottom: 24px; color: var(--amber-hi); }
    h1 { font-size: 18px; letter-spacing: 3px; color: var(--amber-hi); text-transform: uppercase; margin-bottom: 16px; }
    p { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; }
    .open-app {
      display: inline-block; padding: 14px 32px; background: transparent;
      border: 1px solid var(--amber-dim); color: var(--amber-hi);
      text-decoration: none; letter-spacing: 2px; font-size: 12px; text-transform: uppercase;
      border-radius: 4px; cursor: pointer; font-family: inherit;
    }
    .open-app:hover { background: var(--amber-dim); color: var(--black); text-decoration: none; }
    .error h1, .error .icon { color: var(--danger); }
    .error .open-app { border-color: var(--danger); color: var(--danger); }
    footer { text-align: center; padding: 24px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }
    footer a { color: var(--text-dim); margin: 0 12px; }
    @media (max-width: 600px) { nav { padding: 16px 20px; } .card { padding: 32px 20px; } }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">KATABASIS</a>
    <div class="nav-links">
      <a href="/support">Support</a>
      <a href="/privacy">Privacy</a>
    </div>
  </nav>

  <main>
    <div class="card" id="card">
      <div class="icon" id="icon">✓</div>
      <h1 id="title">Email Verified</h1>
      <p id="message">Your email address has been confirmed. You can now open Katabasis and sign in.</p>
      <a href="katabasis://" class="open-app" id="openApp">Open App</a>
    </div>
  </main>

  <footer>
    <a href="/">Home</a>
    <a href="/support">Support</a>
    <a href="/privacy">Privacy Policy</a>
    <br><br>© 2026 Katabasis
  </footer>

  <script>
    // ── Localization ──────────────────────────────────────────────────────
    // The static HTML above is the English fallback (shown if JS is disabled).
    // Language source, in priority order: ?lang= query (authoritative — only
    // present if the backend later appends it to email_redirect_to), then the
    // browser/phone language, then English. We deliberately do NOT depend on
    // the ?lang param so we never break the working confirm flow if Supabase's
    // redirect allow-list rejects query params.
    const I18N = {
      en: { ok: "Email Verified", okMsg: "Your email address has been confirmed. You can now open Katabasis and sign in.", open: "Open App", err: "Verification Failed", errMsg: "This link is invalid or has expired. Please request a new confirmation email from the app." },
      tr: { ok: "E-posta Doğrulandı", okMsg: "E-posta adresin onaylandı. Artık Katabasis'i açıp giriş yapabilirsin.", open: "Uygulamayı Aç", err: "Doğrulama Başarısız", errMsg: "Bu bağlantı geçersiz veya süresi dolmuş. Lütfen uygulamadan yeni bir onay e-postası iste." },
      de: { ok: "E-Mail bestätigt", okMsg: "Deine E-Mail-Adresse wurde bestätigt. Du kannst Katabasis jetzt öffnen und dich anmelden.", open: "App öffnen", err: "Bestätigung fehlgeschlagen", errMsg: "Dieser Link ist ungültig oder abgelaufen. Bitte fordere in der App eine neue Bestätigungs-E-Mail an." },
      fr: { ok: "E-mail confirmé", okMsg: "Votre adresse e-mail a été confirmée. Vous pouvez maintenant ouvrir Katabasis et vous connecter.", open: "Ouvrir l'app", err: "Échec de la confirmation", errMsg: "Ce lien est invalide ou a expiré. Veuillez demander un nouvel e-mail de confirmation depuis l'application." },
      es: { ok: "Correo verificado", okMsg: "Tu correo electrónico ha sido confirmado. Ya puedes abrir Katabasis e iniciar sesión.", open: "Abrir app", err: "Error de verificación", errMsg: "Este enlace no es válido o ha caducado. Solicita un nuevo correo de confirmación desde la aplicación." },
      ru: { ok: "Почта подтверждена", okMsg: "Ваш адрес электронной почты подтверждён. Теперь вы можете открыть Katabasis и войти.", open: "Открыть приложение", err: "Ошибка подтверждения", errMsg: "Эта ссылка недействительна или устарела. Запросите новое письмо подтверждения в приложении." },
      zh: { ok: "邮箱已验证", okMsg: "您的电子邮箱已确认。现在可以打开 Katabasis 并登录。", open: "打开应用", err: "验证失败", errMsg: "此链接无效或已过期。请在应用中重新获取确认邮件。" },
      ko: { ok: "이메일 인증 완료", okMsg: "이메일 주소가 확인되었습니다. 이제 Katabasis를 열고 로그인할 수 있습니다.", open: "앱 열기", err: "인증 실패", errMsg: "이 링크가 유효하지 않거나 만료되었습니다. 앱에서 새 인증 이메일을 요청하세요." },
      ja: { ok: "メール認証完了", okMsg: "メールアドレスが確認されました。Katabasis を開いてログインできます。", open: "アプリを開く", err: "認証に失敗しました", errMsg: "このリンクは無効か期限切れです。アプリから新しい確認メールをリクエストしてください。" },
      el: { ok: "Το email επιβεβαιώθηκε", okMsg: "Η διεύθυνση email σου επιβεβαιώθηκε. Μπορείς τώρα να ανοίξεις το Katabasis και να συνδεθείς.", open: "Άνοιγμα εφαρμογής", err: "Η επιβεβαίωση απέτυχε", errMsg: "Αυτός ο σύνδεσμος δεν είναι έγκυρος ή έχει λήξει. Ζήτησε νέο email επιβεβαίωσης από την εφαρμογή." },
    };
    const qLang = new URLSearchParams(window.location.search).get("lang");
    const navLang = (navigator.language || "en").slice(0, 2).toLowerCase();
    const lang = I18N[qLang] ? qLang : (I18N[navLang] ? navLang : "en");
    const t = I18N[lang];
    document.documentElement.lang = lang;

    // Supabase returns errors in the URL hash as #error=...&error_description=...
    // (e.g., when the link has expired or has already been used).
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const error = hash.get("error_description") || hash.get("error");
    if (error) {
      const card = document.getElementById("card");
      card.classList.add("error");
      document.getElementById("icon").textContent = "!";
      document.getElementById("title").textContent = t.err;
      document.getElementById("message").textContent = t.errMsg;
    } else {
      document.getElementById("title").textContent = t.ok;
      document.getElementById("message").textContent = t.okMsg;
    }
    document.getElementById("openApp").textContent = t.open;
    document.title = t.ok + " — Katabasis";
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Katabasis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0a0812;
      --iron: #1a1620;
      --amber-hi: #e8952a;
      --amber-dim: #8a5210;
      --amber: #c87a1a;
      --text: #d4ccd8;
      --text-dim: #8a7e90;
      --border: #2e2838;
      --danger: #c97070;
    }
    body { background: var(--black); color: var(--text); font-family: 'Courier New', Courier, monospace; line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--amber-hi); text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 40px; border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-size: 16px; font-weight: bold; letter-spacing: 4px; color: var(--amber-hi); }
    .nav-links { display: flex; gap: 24px; font-size: 11px; letter-spacing: 2px; }
    .nav-links a { color: var(--text-dim); }
    .nav-links a:hover { color: var(--amber-hi); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .card {
      max-width: 480px; width: 100%;
      background: var(--iron); border: 1px solid var(--border); border-radius: 6px;
      padding: 48px 32px; position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--amber-dim), transparent);
    }
    h1 { font-size: 18px; letter-spacing: 3px; color: var(--amber-hi); text-transform: uppercase; margin-bottom: 24px; text-align: center; }
    p { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 11px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
    input[type="password"] {
      width: 100%; padding: 12px 14px;
      background: var(--black); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font-family: inherit; font-size: 14px;
    }
    input[type="password"]:focus { outline: none; border-color: var(--amber-dim); }
    button {
      width: 100%; padding: 14px; margin-top: 16px;
      background: transparent; border: 1px solid var(--amber-dim);
      color: var(--amber-hi); cursor: pointer;
      letter-spacing: 2px; font-size: 12px; text-transform: uppercase;
      border-radius: 4px; font-family: inherit;
    }
    button:hover:not(:disabled) { background: var(--amber-dim); color: var(--black); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 16px; padding: 12px; border-radius: 4px; font-size: 13px; text-align: center; display: none; }
    .status.success { background: rgba(232, 149, 42, 0.1); border: 1px solid var(--amber-dim); color: var(--amber-hi); display: block; }
    .status.error { background: rgba(201, 112, 112, 0.1); border: 1px solid var(--danger); color: var(--danger); display: block; }
    .hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
    footer { text-align: center; padding: 24px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }
    footer a { color: var(--text-dim); margin: 0 12px; }
    @media (max-width: 600px) { nav { padding: 16px 20px; } .card { padding: 32px 20px; } }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">KATABASIS</a>
    <div class="nav-links">
      <a href="/support">Support</a>
      <a href="/privacy">Privacy</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <h1 id="h1">Reset Password</h1>
      <p id="intro">Enter a new password for your Katabasis account.</p>

      <form id="form">
        <div class="field">
          <label for="pw1" id="lblNew">New Password</label>
          <input type="password" id="pw1" autocomplete="new-password" minlength="6" required />
          <div class="hint" id="hint">At least 6 characters</div>
        </div>
        <div class="field">
          <label for="pw2" id="lblConfirm">Confirm New Password</label>
          <input type="password" id="pw2" autocomplete="new-password" minlength="6" required />
        </div>
        <button type="submit" id="submit">Update Password</button>
      </form>

      <div class="status" id="status"></div>
    </div>
  </main>

  <footer>
    <a href="/">Home</a>
    <a href="/support">Support</a>
    <a href="/privacy">Privacy Policy</a>
    <br><br>© 2026 Katabasis
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── Localization ──────────────────────────────────────────────────────
    // English markup above is the JS-disabled fallback. Language source order:
    // ?lang= query (authoritative, if ever appended), then browser/phone
    // language, then English. error.message strings from Supabase stay English
    // and are appended after a localized prefix.
    const I18N = {
      en: { reset: "Reset Password", intro: "Enter a new password for your Katabasis account.", lblNew: "New Password", hint: "At least 6 characters", lblConfirm: "Confirm New Password", btn: "Update Password", btnUpdating: "Updating…", errLink: "Invalid or expired reset link. Please request a new one from the app.", errValidate: "Could not validate reset link: ", errShort: "Password must be at least 6 characters.", errMismatch: "Passwords do not match.", errUpdate: "Could not update password: ", success: "Password updated successfully. You can now open Katabasis and sign in with your new password." },
      tr: { reset: "Şifre Sıfırla", intro: "Katabasis hesabın için yeni bir şifre gir.", lblNew: "Yeni Şifre", hint: "En az 6 karakter", lblConfirm: "Yeni Şifreyi Onayla", btn: "Şifreyi Güncelle", btnUpdating: "Güncelleniyor…", errLink: "Geçersiz veya süresi dolmuş sıfırlama bağlantısı. Lütfen uygulamadan yenisini iste.", errValidate: "Sıfırlama bağlantısı doğrulanamadı: ", errShort: "Şifre en az 6 karakter olmalı.", errMismatch: "Şifreler eşleşmiyor.", errUpdate: "Şifre güncellenemedi: ", success: "Şifre başarıyla güncellendi. Artık Katabasis'i açıp yeni şifrenle giriş yapabilirsin." },
      de: { reset: "Passwort zurücksetzen", intro: "Gib ein neues Passwort für dein Katabasis-Konto ein.", lblNew: "Neues Passwort", hint: "Mindestens 6 Zeichen", lblConfirm: "Neues Passwort bestätigen", btn: "Passwort aktualisieren", btnUpdating: "Wird aktualisiert…", errLink: "Ungültiger oder abgelaufener Link. Bitte fordere in der App einen neuen an.", errValidate: "Link konnte nicht validiert werden: ", errShort: "Das Passwort muss mindestens 6 Zeichen haben.", errMismatch: "Die Passwörter stimmen nicht überein.", errUpdate: "Passwort konnte nicht aktualisiert werden: ", success: "Passwort erfolgreich aktualisiert. Du kannst Katabasis jetzt öffnen und dich mit deinem neuen Passwort anmelden." },
      fr: { reset: "Réinitialiser le mot de passe", intro: "Entrez un nouveau mot de passe pour votre compte Katabasis.", lblNew: "Nouveau mot de passe", hint: "Au moins 6 caractères", lblConfirm: "Confirmer le nouveau mot de passe", btn: "Mettre à jour", btnUpdating: "Mise à jour…", errLink: "Lien invalide ou expiré. Veuillez en demander un nouveau depuis l'application.", errValidate: "Impossible de valider le lien : ", errShort: "Le mot de passe doit comporter au moins 6 caractères.", errMismatch: "Les mots de passe ne correspondent pas.", errUpdate: "Impossible de mettre à jour le mot de passe : ", success: "Mot de passe mis à jour. Vous pouvez maintenant ouvrir Katabasis et vous connecter avec votre nouveau mot de passe." },
      es: { reset: "Restablecer contraseña", intro: "Introduce una nueva contraseña para tu cuenta de Katabasis.", lblNew: "Nueva contraseña", hint: "Al menos 6 caracteres", lblConfirm: "Confirmar nueva contraseña", btn: "Actualizar contraseña", btnUpdating: "Actualizando…", errLink: "Enlace no válido o caducado. Solicita uno nuevo desde la aplicación.", errValidate: "No se pudo validar el enlace: ", errShort: "La contraseña debe tener al menos 6 caracteres.", errMismatch: "Las contraseñas no coinciden.", errUpdate: "No se pudo actualizar la contraseña: ", success: "Contraseña actualizada correctamente. Ya puedes abrir Katabasis e iniciar sesión con tu nueva contraseña." },
      ru: { reset: "Сброс пароля", intro: "Введите новый пароль для вашего аккаунта Katabasis.", lblNew: "Новый пароль", hint: "Не менее 6 символов", lblConfirm: "Подтвердите новый пароль", btn: "Обновить пароль", btnUpdating: "Обновление…", errLink: "Недействительная или просроченная ссылка. Запросите новую в приложении.", errValidate: "Не удалось проверить ссылку: ", errShort: "Пароль должен содержать не менее 6 символов.", errMismatch: "Пароли не совпадают.", errUpdate: "Не удалось обновить пароль: ", success: "Пароль успешно обновлён. Теперь вы можете открыть Katabasis и войти с новым паролем." },
      zh: { reset: "重置密码", intro: "为您的 Katabasis 账户输入新密码。", lblNew: "新密码", hint: "至少 6 个字符", lblConfirm: "确认新密码", btn: "更新密码", btnUpdating: "更新中…", errLink: "链接无效或已过期。请在应用中重新获取。", errValidate: "无法验证链接：", errShort: "密码至少需要 6 个字符。", errMismatch: "两次输入的密码不一致。", errUpdate: "无法更新密码：", success: "密码已成功更新。现在可以打开 Katabasis 并使用新密码登录。" },
      ko: { reset: "비밀번호 재설정", intro: "Katabasis 계정의 새 비밀번호를 입력하세요.", lblNew: "새 비밀번호", hint: "최소 6자", lblConfirm: "새 비밀번호 확인", btn: "비밀번호 변경", btnUpdating: "변경 중…", errLink: "유효하지 않거나 만료된 링크입니다. 앱에서 새로 요청하세요.", errValidate: "링크를 확인할 수 없습니다: ", errShort: "비밀번호는 최소 6자 이상이어야 합니다.", errMismatch: "비밀번호가 일치하지 않습니다.", errUpdate: "비밀번호를 변경할 수 없습니다: ", success: "비밀번호가 변경되었습니다. 이제 Katabasis를 열고 새 비밀번호로 로그인할 수 있습니다." },
      ja: { reset: "パスワードの再設定", intro: "Katabasis アカウントの新しいパスワードを入力してください。", lblNew: "新しいパスワード", hint: "6 文字以上", lblConfirm: "新しいパスワードの確認", btn: "パスワードを更新", btnUpdating: "更新中…", errLink: "リンクが無効か期限切れです。アプリから新しく取得してください。", errValidate: "リンクを検証できませんでした: ", errShort: "パスワードは 6 文字以上である必要があります。", errMismatch: "パスワードが一致しません。", errUpdate: "パスワードを更新できませんでした: ", success: "パスワードを更新しました。Katabasis を開いて新しいパスワードでログインできます。" },
      el: { reset: "Επαναφορά κωδικού", intro: "Εισάγετε έναν νέο κωδικό για τον λογαριασμό σας στο Katabasis.", lblNew: "Νέος κωδικός", hint: "Τουλάχιστον 6 χαρακτήρες", lblConfirm: "Επιβεβαίωση νέου κωδικού", btn: "Ενημέρωση κωδικού", btnUpdating: "Ενημέρωση…", errLink: "Μη έγκυρος ή ληγμένος σύνδεσμος. Ζητήστε νέον από την εφαρμογή.", errValidate: "Δεν ήταν δυνατή η επικύρωση του συνδέσμου: ", errShort: "Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.", errMismatch: "Οι κωδικοί δεν ταιριάζουν.", errUpdate: "Δεν ήταν δυνατή η ενημέρωση του κωδικού: ", success: "Ο κωδικός ενημερώθηκε. Μπορείτε τώρα να ανοίξετε το Katabasis και να συνδεθείτε με τον νέο κωδικό." },
    };
    const qLang = new URLSearchParams(window.location.search).get("lang");
    const navLang = (navigator.language || "en").slice(0, 2).toLowerCase();
    const lang = I18N[qLang] ? qLang : (I18N[navLang] ? navLang : "en");
    const t = I18N[lang];
    document.documentElement.lang = lang;
    document.title = t.reset + " — Katabasis";
    document.getElementById("h1").textContent = t.reset;
    document.getElementById("intro").textContent = t.intro;
    document.getElementById("lblNew").textContent = t.lblNew;
    document.getElementById("hint").textContent = t.hint;
    document.getElementById("lblConfirm").textContent = t.lblConfirm;
    document.getElementById("submit").textContent = t.btn;

    // Public Supabase credentials — anon key is designed for client-side use.
    const SUPABASE_URL = "https://tvomonepnxucrcqeylec.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2b21vbmVwbnh1Y3JjcWV5bGVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MTA3ODUsImV4cCI6MjA5MzM4Njc4NX0.J0UlUREtfpUSAwPqeRB8xSt9uiNWAXzeE86z0X9_s9I";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    });

    const status = document.getElementById("status");
    const form = document.getElementById("form");
    const submitBtn = document.getElementById("submit");

    function show(kind, msg) {
      status.className = "status " + kind;
      status.textContent = msg;
    }

    // Parse the recovery session from the URL hash (Supabase sends
    // #access_token=...&refresh_token=...&type=recovery).
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const hashError = hash.get("error_description") || hash.get("error");
    const accessToken = hash.get("access_token");
    const refreshToken = hash.get("refresh_token");
    const type = hash.get("type");

    async function init() {
      if (hashError) {
        form.style.display = "none";
        show("error", t.errLink);
        return;
      }
      if (!accessToken || !refreshToken || type !== "recovery") {
        form.style.display = "none";
        show("error", t.errLink);
        return;
      }
      const { error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
      if (error) {
        form.style.display = "none";
        show("error", t.errValidate + error.message);
      }
    }
    init();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;
      if (pw1.length < 6) {
        show("error", t.errShort);
        return;
      }
      if (pw1 !== pw2) {
        show("error", t.errMismatch);
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = t.btnUpdating;
      const { error } = await sb.auth.updateUser({ password: pw1 });
      if (error) {
        show("error", t.errUpdate + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = t.btn;
      } else {
        form.style.display = "none";
        show("success", t.success);
        // Clear the recovery session so the access token doesn't linger
        sb.auth.signOut().catch(() => {});
      }
    });
  </script>
</body>
</html>
